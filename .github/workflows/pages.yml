name: Publish English course

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout verified course release
        uses: actions/checkout@v4
      - name: Verify and unpack complete v2 course
        run: |
          mkdir _site
          cat releases/v2/field-english-90-v2-part01.zip.* > part1.zip
          echo 'd6ccb988b9c4a5dacd605a7596d5f9185a45b4d5b2e319736a314b5111586b93  part1.zip' | sha256sum --check
          unzip -q part1.zip -d _site
          cat releases/v2/field-english-90-v2-part02.zip.* > part2.zip
          echo '67de7e48a1d038ebf6e5c0e61f6a3b07f0932cb45a8ddbbdbcb68889ba4962fc  part2.zip' | sha256sum --check
          unzip -q part2.zip -d _site
          cat releases/v2/field-english-90-v2-part03.zip.* > part3.zip
          echo '04f94d043947710cc22fc07d47ddcd640cd58f932e320ef38f4f5f62aff735bc  part3.zip' | sha256sum --check
          unzip -q part3.zip -d _site
          cat releases/v2/field-english-90-v2-part04.zip.* > part4.zip
          echo 'a921121a2ad72c2a787008fd354e4de8ba67fac75d96b68bbcd18841e8c00b86  part4.zip' | sha256sum --check
          unzip -q part4.zip -d _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
