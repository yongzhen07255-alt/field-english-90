name: Publish English course

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download and verify course
        run: |
          curl --fail --silent --show-error --location --retry 2 --proto '=https' --tlsv1.2 'https://field-english-90.yongzhen07255.chatgpt.site/releases/field-english-90-v1.zip' -o course.zip
          echo '4bc4997e6501a98876851bdee01deb0b518e9f78b2a356267dad6cac4e9eb814  course.zip' | sha256sum --check
          mkdir _site
          unzip -q course.zip -d _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
