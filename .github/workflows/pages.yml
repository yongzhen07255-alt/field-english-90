name: Publish English course
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify base release and build simple lessons
        shell: bash
        run: |
          set -euo pipefail
          mkdir _site
          hashes=(d6ccb988b9c4a5dacd605a7596d5f9185a45b4d5b2e319736a314b5111586b93 67de7e48a1d038ebf6e5c0e61f6a3b07f0932cb45a8ddbbdbcb68889ba4962fc 04f94d043947710cc22fc07d47ddcd640cd58f932e320ef38f4f5f62aff735bc a921121a2ad72c2a787008fd354e4de8ba67fac75d96b68bbcd18841e8c00b86)
          for n in 1 2 3 4; do
            cat releases/v2/field-english-90-v2-part0$n.zip.* > base.zip
            echo "${hashes[$((n-1))]}  base.zip" | sha256sum --check
            unzip -q base.zip -d _site
          done
          python3 simple/build.py _site
          tar czf course.tgz -C _site .
      - uses: actions/upload-artifact@v4
        with:
          name: course
          path: course.tgz
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: text-to-record
          path: simple-audio.json
          retention-days: 1
  speech:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: simple
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: text-to-record
      - name: Prepare local speech engine
        run: |
          python -m pip install --disable-pip-version-check kokoro-onnx==0.6.1
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          mkdir -p models
          for f in kokoro-v1.0.int8.onnx voices-v1.0.bin; do curl -fsSL --retry 4 "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f" -o "models/$f"; done
      - name: Record and validate English MP3s
        run: python simple/audio.py _site models ${{ matrix.shard }} 8
      - uses: actions/upload-artifact@v4
        with:
          name: speech-${{ matrix.shard }}
          path: _site/audio/simple/*.mp3
          retention-days: 1
  deploy:
    needs: speech
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.ship.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: course
      - run: mkdir -p _site && tar xzf course.tgz -C _site
      - uses: actions/download-artifact@v4
        with:
          pattern: speech-*
          path: _site/audio/simple
          merge-multiple: true
      - name: Check every active recording before publishing
        run: |
          python3 - <<'PY'
          import json,pathlib,hashlib
          site=pathlib.Path('_site');course=json.loads((site/'course.json').read_text());assert course['version']=='3.0.0'
          clips=[site/c['audio'] for c in course['cards'] if c.get('active') and c.get('audio')];assert all(c.is_file() and c.stat().st_size>2000 for c in clips)
          assert len(list((site/'audio/simple').glob('*.mp3')))==630
          (site/'checksums.json').write_text(json.dumps({n:hashlib.sha256((site/n).read_bytes()).hexdigest() for n in ['course.json','sw.js','app.js','pocket.html']}))
          print('Verified',len(clips),'active recordings')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: ship
        uses: actions/deploy-pages@v4
